name: Validate PR source for development

on:
  pull_request:
    branches: [ development ]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  enforce-feature-source:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure source branch matches feature/*
        run: |
          if [[ "${{ github.head_ref }}" != feature/* ]]; then
            echo "Only feature/* branches can be merged into development."
            echo "Current source branch: ${{ github.head_ref }}"
            exit 1
          fi
