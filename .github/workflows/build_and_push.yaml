name: Build and push Docker image

on:
  push:
    branches: [ development, main ]
  workflow_dispatch:

env:
  OWNER_LC: ${{ github.repository_owner }}

jobs:
  approval-main:
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'main' }}
    environment: prod
    steps:
      - run: echo "Main branch approved"

  build-and-push:
    runs-on: ubuntu-latest
    needs: [approval-main]
    if: ${{ always() && (github.ref_name == 'development' || needs.approval-main.result == 'success') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set TARGET_ENV for development
        if: ${{ github.ref_name == 'development' }}
        run: echo "TARGET_ENV=dev" >> $GITHUB_ENV

      - name: Set TARGET_ENV for main
        if: ${{ github.ref_name == 'main' }}
        run: echo "TARGET_ENV=release" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image using Makefile
        run: make push
        env:
          DOCKER_BUILDKIT: 1
          OWNER: ${{ github.repository_owner }}