name: Build and push Docker image

on:
  push:
    branches: [ development ]
  workflow_dispatch:  
env:
  OWNER_LC: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for git operations